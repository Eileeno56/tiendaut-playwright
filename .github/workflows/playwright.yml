name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Lint (análisis estático de las pruebas)
      run: npm run lint
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      # --update-snapshots=missing: si no existe la imagen de referencia de Linux, la crea en lugar de fallar
      run: npm run test:estabilidad -- --update-snapshots=missing
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
          tests/red-y-visual.spec.ts-snapshots/
        retention-days: 30
