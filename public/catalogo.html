<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Catálogo | TiendaUT</title></head>
<body>
  <main>
  <h1>Catálogo</h1>
  <p>Carrito: <span data-testid="contador-carrito">0</span> productos</p>
  <label for="buscar">Buscar producto</label>
  <input placeholder="Buscar producto" id="buscar">
  <button id="vaciar">Vaciar carrito</button>
  <img src="/logo.png" alt="TiendaUT" width="120" height="40">
  <p id="error-productos" role="alert" hidden></p>
  <ul id="lista"><li>Cargando...</li></ul>
  </main>
  <script>
    let carrito = 0;
    const lista = document.getElementById('lista');
    const contador = document.querySelector('[data-testid="contador-carrito"]');
    let productos = [];

    function pintar(filtro = '') {
      lista.innerHTML = '';
      productos
        .filter(p => p.nombre.toLowerCase().includes(filtro.toLowerCase()))
        .forEach(p => {
          const li = document.createElement('li');
          li.dataset.testid = 'producto';
          li.innerHTML = `<h2>${p.nombre}</h2><span>$${p.precio}</span>
                          <button>Agregar al carrito</button>`;
          li.querySelector('button').addEventListener('click', () => {
            carrito++;
            contador.textContent = carrito;
          });
          lista.appendChild(li);
        });
    }

    fetch('/api/productos')
      .then(r => {
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return r.json();
      })
      .then(data => {
        productos = data;
        pintar(document.getElementById('buscar').value);
      })
      .catch(() => {
        productos = [];
        pintar();
        const error = document.getElementById('error-productos');
        error.textContent = 'No pudimos cargar los productos';
        error.hidden = false;
      });
    document.getElementById('buscar').addEventListener('input', e => pintar(e.target.value));

    document.getElementById('vaciar').addEventListener('click', () => {
      carrito = 0;
      contador.textContent = String(carrito);
    });
  </script>
</body>
</html>
